name: Update results and deploy dashboard

on:
  schedule:
    # Mega 6/45 quay Thu 4 / Thu 6 / CN 18:05 ICT = 11:05 UTC
    - cron: "20 11 * * 0,3,5"
    # Power 6/55 quay Thu 3 / Thu 5 / Thu 7 18:05 ICT = 11:05 UTC
    - cron: "20 11 * * 2,4,6"
    # Luoi an toan moi ngay
    - cron: "5 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vietlott_tracker.py"
      - "vietlott_power655.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch new draws (Mega 6/45)
        run: python vietlott_tracker.py update

      - name: Fetch new draws (Power 6/55)
        run: python vietlott_power655.py update

      - name: Self-verification
        run: |
          python vietlott_tracker.py verify | tee verify-mega.txt
          python vietlott_power655.py verify | tee verify-power.txt
          {
            echo "## Mega 6/45"
            echo '```'
            cat verify-mega.txt
            echo '```'
            echo "## Power 6/55"
            echo '```'
            cat verify-power.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build dashboards
        run: |
          python vietlott_tracker.py dashboard
          python vietlott_tracker.py report | tee report-mega.txt
          python vietlott_power655.py dashboard
          python vietlott_power655.py report | tee report-power.txt
          rm -rf public
          mkdir -p public/power
          cp vietlott_dashboard.html   public/index.html
          cp vietlott_mega645_full_history.csv public/data.csv
          cp report-mega.txt public/report.txt
          cp verify-mega.txt public/verify.txt
          cp vietlott_power655_dashboard.html public/power/index.html
          cp vietlott_power655_full_history.csv public/power/data.csv
          cp report-power.txt public/power/report.txt
          cp verify-power.txt public/power/verify.txt
          ls -R public

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vietlott_mega645_full_history.csv vietlott_predictions.json vietlott_dashboard.html
          git add vietlott_power655_full_history.csv vietlott_power655_predictions.json vietlott_power655_dashboard.html
          if git diff --cached --quiet; then
            echo "khong co thay doi du lieu"
            exit 0
          fi
          git commit -m "data: update mega+power $(date -u +%Y-%m-%dT%H:%MZ)"
          # neu run khac vua push thi rebase roi push lai
          for i in 1 2 3; do
            if git push; then
              echo "pushed"
              exit 0
            fi
            echo "push that bai, thu lai lan $i"
            sleep $((i * 5))
            git pull --rebase --autostash -q || true
          done
          echo "::error::khong the push sau 3 lan thu"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
